<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        form {
            width: 300px;
            margin: 150px auto;
            border: 2px solid black;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
<form action="" method="post">
    <h1>Sign Up</h1>
    <p>
    <label for="name">Name:</label>
    <input type="text" id="name" name="SU_name">
    </p>

    <p>
    <label for="email">Email:</label>
    <input type="email" id="email" name="SU_email">
    </p>

    <p>
    <label for="password">Password:</label>
    <input type="password" id="password" name="SU_password">
    </p>

    <input type="submit" value="Sign Up">
</form>
</body>
</html>
